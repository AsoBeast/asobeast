version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/api
      - /apps/web
      - /apps/mcp
      - /packages/shared
      - /packages/mcp-tools
      - /packages/typescript-config
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      production-majors:
        dependency-type: production
        update-types: [major]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      development-majors:
        dependency-type: development
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
      github-actions-majors:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
