name: Bug report
description: Report reproducible incorrect behaviour in asobeast.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: input
    id: version
    attributes:
      label: asobeast version
      description: Copy the version from the footer or the release tag.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local pnpm dev
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Required when running locally. Enter not applicable for Docker Compose.
      placeholder: v22.22.1
    validations:
      required: true
  - type: input
    id: store-country
    attributes:
      label: Store and country
      placeholder: Apple App Store, us
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and full error output
      render: shell
    validations:
      required: true
  - type: textarea
    id: api-logs
    attributes:
      label: API logs
      description: Remove credentials and tokens before pasting logs.
      render: shell
    validations:
      required: true
