name: Publish to the MCP Registry
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MCP_REGISTRY_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.8.0
        required: true
        type: string
permissions:
  contents: read
env:
  MCP_PUBLISHER_VERSION: 1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft)
          test "$draft" = "false"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Assert server.json carries the release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(jq -er .version server.json)" || { echo "::error::${RELEASE_TAG} carries no server.json version"; exit 1; }
          if [ "v${version}" != "$RELEASE_TAG" ]; then
            echo "::error::server.json reads ${version} but the tag is ${RELEASE_TAG}"
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Sign in with the asobeast.com domain
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: mcp-publisher login dns --domain asobeast.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
      - name: Publish server.json
        run: mcp-publisher publish server.json
