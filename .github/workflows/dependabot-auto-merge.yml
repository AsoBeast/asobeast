name: Dependabot auto merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide whether the update qualifies
        id: decide
        env:
          ELIGIBLE: ${{ contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type) }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "eligible=${ELIGIBLE}" >>"${GITHUB_OUTPUT}"
          echo "update-type: ${UPDATE_TYPE}, eligible: ${ELIGIBLE}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Enable auto merge
        if: steps.decide.outputs.eligible == 'true' && github.event.pull_request.auto_merge == null
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PR_URL}"

      - name: Withdraw auto merge from an update that no longer qualifies
        if: steps.decide.outputs.eligible != 'true' && github.event.pull_request.auto_merge != null
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "${PR_URL}"
