name: Published images
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/verify-anonymous-pull.mjs
      - .github/workflows/published-images.yml
      - .github/workflows/docker-publish.yml
permissions:
  contents: read
concurrency:
  group: published-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anonymous-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve the images the pull stack runs
        env:
          POSTGRES_PASSWORD: unused
          AUTH_SECRET: unused
        run: |
          set -euo pipefail
          docker compose -f docker-compose.pull.yml config --images | grep '^ghcr\.io/' | tee images.txt
      - name: Pull every image without credentials
        run: xargs node .github/scripts/verify-anonymous-pull.mjs < images.txt
