body:
  - type: markdown
    attributes:
      value: Share something you built with asobeast, such as an MCP workflow, a dashboard on the API, a deployment recipe or a write-up.
  - type: textarea
    id: what
    attributes:
      label: What you built
      description: What it does and which part of asobeast it uses.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: A repository, post or demo, if there is one.
      placeholder: https://
    validations:
      required: false
