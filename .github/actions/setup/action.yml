name: Set up the workspace
description: pnpm, Node 24, the pnpm store restored from main, dependencies installed and the Prisma client generated
inputs:
  store-cache:
    description: Restore the pnpm store written by main, and save it when this run is main
    default: "true"
  chromium:
    description: Install the Chromium headless shell, restored from the main cache when the lockfile matches
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - if: inputs.store-cache == 'true'
      id: store-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm --filter api exec prisma generate
    - if: inputs.store-cache == 'true' && github.ref == 'refs/heads/main' && steps.store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: inputs.chromium == 'true'
      id: chromium-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-shell-${{ hashFiles('pnpm-lock.yaml') }}
    - if: inputs.chromium == 'true'
      shell: bash
      run: pnpm --filter web exec playwright install --with-deps --only-shell chromium
    - if: inputs.chromium == 'true' && github.ref == 'refs/heads/main' && steps.chromium-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-shell-${{ hashFiles('pnpm-lock.yaml') }}
