name: asobeast

services:
  postgres:
    extends:
      file: docker-compose.pull.yml
      service: postgres
  redis:
    extends:
      file: docker-compose.pull.yml
      service: redis
  api:
    extends:
      file: docker-compose.pull.yml
      service: api
    env_file: !reset []
    volumes: !reset []
  web:
    extends:
      file: docker-compose.pull.yml
      service: web
    env_file: !reset []
volumes:
  pgdata:
  redisdata:
networks:
  frontend:
  backend:
    internal: true
